<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>35' — Тренажёр продаж</title>
<style>
:root{--bg:#14171a;--p:#1b1f22;--p2:#21262a;--line:#2b3236;--ink:#edefe9;--dim:#9aa39c;--lime:#c6ff3d;--bad:#ff6b57;--mid:#e8b84b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;padding:20px 12px 50px}.app{max-width:650px;margin:auto;background:var(--p);border:1px solid var(--line);border-radius:18px;overflow:hidden}.head{padding:16px 18px;border-bottom:1px solid var(--line);background:var(--p2);display:flex;justify-content:space-between}.num{font-size:22px;font-weight:800}.sub{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:1.5px}.clock{color:var(--lime)}.progress{display:flex;gap:4px;padding:14px 18px}.dot{height:4px;flex:1;background:var(--line);border-radius:3px}.done{background:var(--lime)}.cur{background:var(--dim)}.score{padding:0 18px 10px;font-size:12px;color:var(--dim);display:flex;justify-content:space-between}.strip{padding:9px 18px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);font-size:12px;color:var(--dim)}main{padding:22px 18px}.center{text-align:center;padding:30px 22px}.center h1{margin:12px 0 8px}.center p{color:var(--dim);line-height:1.55}.map{display:grid;gap:10px;text-align:left;margin:22px 0}.row,.quote,.opt,.feedback{background:var(--p2);border:1px solid var(--line);border-radius:12px}.row{padding:12px}.client{display:flex;gap:12px;align-items:center}.avatar{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--p2);border:1px solid var(--line);color:var(--lime);font-weight:700}.role{font-size:12px;color:var(--dim)}.quote{margin:18px 0;padding:14px 15px;line-height:1.5}.label{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:1px;margin-bottom:9px}.opts{display:grid;gap:9px}.opt{padding:13px 14px;color:var(--ink);text-align:left;font-size:14px;line-height:1.45;cursor:pointer}.opt:hover{border-color:var(--lime)}.correct{border-color:var(--lime);background:rgba(198,255,61,.08)}.mid{border-color:var(--mid);background:rgba(232,184,75,.08)}.wrong{border-color:var(--bad);background:rgba(255,107,87,.08)}button.btn{margin-top:18px;border:0;border-radius:10px;background:var(--lime);color:#10130e;font-weight:700;padding:11px 18px;cursor:pointer}.feedback{display:none;margin-top:14px;padding:14px;line-height:1.5}.feedback.show{display:block}.next{text-align:right}.big{font-size:44px;font-weight:800;color:var(--lime)}.foot{padding:13px;text-align:center;color:var(--dim);font-size:11px;border-top:1px solid var(--line)}
</style>
</head>
<body><div class="app" id="app"></div>
<script>
const blocks=[
["Блок 1 · Точечные возражения",1,2,1,0,[
["Гульнара","42 года · менеджер","Г","У меня уже есть абонемент в обычный зал за 15 000 тенге в месяц, а у вас «Старт» — 99 000. Это же в 6 раз дороже!",
["Спросить, сколько часов в неделю она реально тренируется, и посчитать вместе итоговую стоимость — с учётом персонального тренера, диагностики Tanita и гарантии результата.","В обычном зале эти услуги обычно оплачиваются отдельно. В 35' Health Clubs они входят в формат, поэтому сравнивать нужно не только цену абонемента."],
["Сказать: «Зато у нас тренажёры круче — импортные, умные».","Это слишком общее утверждение без конкретной ценности."],
["Сразу предложить скидку, чтобы закрыть тему.","Скидка в первой реплике обесценивает продукт."]],
["Ерлан","29 лет · IT-специалист","Е","35 минут — это несерьёзно, я обычно 1,5–2 часа в зале провожу!",
["Объяснить принцип круга MILON: 2 круга по 6 упражнений, силовые чередуются с кардио без пауз, поэтому нагрузка идёт непрерывно.","Здесь важна плотность нагрузки, а не просто количество времени в зале."],
["Сказать: «Ну так короче — удобнее же».","Удобство не отвечает на сомнение в эффективности."],
["Согласиться: «Да, тренировка меньше, зато время сэкономите».","Так вы подтверждаете опасение, что тренировка слабее."]],
["Айгуль","51 год · бухгалтер","А","У меня старая травма колена. Боюсь тренажёров — вдруг станет только хуже?",
["Объяснить изокинетический режим: тренажёр задаёт контролируемую траекторию и скорость, а тренер контролирует технику.","Конкретный механизм безопасности убедительнее общего «у нас безопасно»."],
["Сказать: «Не переживайте, у нас безопасно».","Для человека с травмой нужны конкретные объяснения."],
["Посоветовать сначала обычный зал для разминки.","Это не лучший совет: разминка встроена в формат круга."]],
["Нурлан","45 лет · инженер","Н","Ваш клуб не в моём районе, далеко ехать что после работы, что с утра.",
["Уточнить, где удобнее тренироваться, и предложить тариф с доступом к нескольким клубам сети.","Сначала определяем маршрут клиента, затем показываем подходящий тариф."],
["Сказать: «У нас много клубов по городу».","Расплывчато — нужна конкретика по доступу."],
["Предложить ходить в единственный ближайший клуб.","Вы предложили решение, не выяснив задачу."]],
["Светлана","33 года · дизайнер","С","У меня нет силы воли, я всегда бросаю фитнес максимум через месяц.",
["Объяснить низкий порог входа: 2–3 раза в неделю по 35 минут, сопровождение тренера и измеримый прогресс по Tanita.","Регулярность, контроль и видимый прогресс помогают не срываться."],
["Сказать: «У нас интересно, точно не бросите».","Обещание без механизма звучит слишком общо."],
["Сказать, что сила воли не нужна — тренажёр всё сделает сам.","Это преувеличение и подрывает доверие."]]
]],
["Блок 2 · Возражения с чужим мнением",2,3,1,-1,[
["Данияр","35 лет · предприниматель","Д","Я уже пробовал три разных фитнеса, нигде не было результата. Больше в это не верю.",
["Рассказать про гарантию результата: при соблюдении программы и отсутствии изменений по Tanita действует 100% возврат денег.","Гарантия снижает риск и переводит разговор от обещаний к измеримому результату."],
["Предложить бесплатную пробную тренировку без объяснений.","Хороший шаг, но он не отвечает на главный страх — снова не получить результат."],
["Сказать: «У нас всё по-другому, точно сработает».","Голословное обещание после неудачного опыта усиливает недоверие."]],
["Жанна","38 лет · мама двоих детей","Ж","Работаю допоздна, боюсь не успевать и стоять в очереди на тренажёры.",
["Объяснить: одновременно максимум 8 человек, круг идёт по таймингу; уточнить удобное время и часы работы.","Конкретные цифры дают предсказуемость занятому клиенту."],
["Сказать: «У нас удобный график».","Без конкретики клиент не понимает, как это работает."],
["Перенести все тренировки на выходные, не уточняя расписание.","Решение предложено раньше, чем понята проблема."]],
["Марат","40 лет · водитель","М","Жена сказала, что это разводка — обычный фитнес не хуже, а стоит меньше.",
["Не спорить с мнением жены, а показать реальные результаты клиентов и предложить пробное занятие с диагностикой.","Личный опыт и цифры сильнее спора с третьим лицом."],
["Сказать: «Жена не права».","Вы ставите клиента перед ненужным выбором."],
["Сразу предложить самый дешёвый тариф.","Сначала нужно объяснить ценность, а не уходить в скидку."]],
["Инна","29 лет · SMM-специалист","И","У вас как в MLM — на каждом шагу допродажи, тариф повыше, ещё сервис…",
["Честно объяснить конкретные различия тарифов: доступ к сети, Health coach, трекер активности — и подобрать только нужные опции.","Прозрачность структуры тарифов снимает подозрение в манипуляции."],
["Сказать: «У нас без допродаж».","Одного отрицания недостаточно."],
["Сразу презентовать Premium.","Это как раз подтверждает её опасение."]],
["Асель","37 лет · переводчик","А","Я тренируюсь сама дома по видео с ютуба, зачем мне тренер и клуб.",
["Сравнить: видео не корректирует технику и нагрузку под показатели тела; тренер и оборудование дают персонализацию и контроль.","Разница — в персонализации и контроле, а не в критике домашних тренировок."],
["Сказать: «Дома неэффективно».","Без аргумента это звучит как обесценивание."],
["Раскритиковать видео-тренировки в целом.","Критика без альтернативы вызывает защитную реакцию."]]
]],
["Блок 3 · Закрытие сделки",3,4,1,-2,[
["Тимур","27 лет · маркетолог","Т","Мне нужно подумать, почитаю отзывы в интернете.",
["Предложить бесплатную пробную тренировку с анализом состава тела, чтобы он проверил продукт на себе.","Низкорисковый следующий шаг лучше, чем спор с желанием «подумать»."],
["Дать ссылку на отзывы.","Пассивно: инициатива полностью остаётся у клиента."],
["Надавить: «Акция только сегодня».","Искусственная срочность подрывает доверие."]],
["Ольга","34 года · прошла бесплатное занятие и диагностику","О","Молчит после пробной тренировки. Эмоции хорошие, но сама решения не предлагает.",
["«По вашей диагностике цель — минус 5 кг жировой массы за 3 месяца. Оформляем подходящий квартальный тариф и начинаем на этой неделе?»","Конкретная цель + конкретный следующий шаг превращают интерес в решение."],
["«Ну как вам, понравилось? Будете покупать?»","Открытый вопрос легко заканчивается ответом «я подумаю»."],
["«Если не купите сегодня, цена может измениться».","Давление без основания разрушает доверие."]],
["Бекзат","31 год · логист","Б","Отправьте всё на Ватсап, я подумаю и напишу.",
["Отправить прайс и диагностику и договориться о конкретном времени следующего звонка.","Материалы плюс следующий контакт превращают расплывчатое «напишу» в процесс."],
["Просто отправить прайс.","Инициатива полностью переходит клиенту."],
["Не отправлять ничего и ждать.","Вы не выполняете обещание и теряете инициативу."]],
["Артём","26 лет · готов оформлять, но торгуется","Ар","Всё нравится, но дайте просто скидку 20%, и я оформлю прямо сейчас.",
["Не снижать цену вне программ, а показать экономию от более длительного тарифа: стоимость месяца ниже за счёт формата.","Вы сохраняете ценность продукта и даёте законный способ сэкономить."],
["Сразу согласиться на скидку 20%.","Сделка закрыта, но вы создаёте плохой прецедент."],
["Отказать: «Скидок нет» — и ничего не предложить.","Можно потерять готового клиента без необходимости."]],
["Вадим","44 года · выбирает между двумя тарифами","В","Не могу решить — «Полугодовой» или годовой «BASIC»? Посоветуйте.",
["Уточнить частоту тренировок и график; у BASIC дневной доступ 09:00–18:00 — и порекомендовать подходящий тариф.","Консультативный выбор по реальному графику лучше автоматической продажи самого дорогого тарифа."],
["Сразу рекомендовать самый дорогой тариф.","Если график не подходит, доверие будет подорвано."],
["Сказать: «Берите любой, разницы нет».","Это не помогает клиенту принять решение."]]
]]
];

let rounds=[];blocks.forEach((b,bi)=>b[5].forEach((r,ri)=>rounds.push({b,bi,ri,r})));
let i=0,score=0,t=35*60,timer=null;
const max=rounds.reduce((s,x)=>s+x.b[2],0);
function clock(){return String(Math.floor(t/60)).padStart(2,"0")+":"+String(t%60).padStart(2,"0")}
function startTimer(){clearInterval(timer);timer=setInterval(()=>{if(t>0){t--;let e=document.querySelector("#clock");if(e)e.textContent=clock()}},1000)}
function renderIntro(){app.innerHTML=`<div class="center"><div><span class="num">35'</span> <span class="sub">Health Clubs</span></div><h1>Тренажёр продаж</h1><p>15 возражений от клиентов, три блока с нарастающей сложностью. Выбирайте лучший ответ и сразу получайте разбор.</p><div class="map">${blocks.map((b,n)=>`<div class="row"><b>${n+1}. ${b[0].split("·")[1].trim()}</b><br><small style="color:var(--dim)">${b[5].length} ситуаций · верный ответ +${b[2]}, ошибка ${b[4]}</small></div>`).join("")}</div><button class="btn" onclick="begin()">Начать смену</button></div><div class="foot">Тренажёр основан на публичной информации 35' Health Clubs — тарифах, методике MILON и условиях гарантии.</div>`}
function begin(){i=0;score=0;t=35*60;startTimer();play()}
function play(){let x=rounds[i],r=x.r,b=x.b;let dots=rounds.map((_,n)=>`<i class="dot ${n<i?"done":n===i?"cur":""}"></i>`).join("");app.innerHTML=`<div class="head"><div><span class="num">35'</span> <span class="sub">Health Clubs</span></div><div class="clock">⏱ <span id="clock">${clock()}</span></div></div><div class="progress">${dots}</div><div class="score"><span>Клиент ${i+1} из ${rounds.length}</span><span>Очки: <b>${score}</b></span></div><div class="strip">${b[0]} · ситуация ${x.ri+1}/${b[5].length}</div><main><div class="client"><div class="avatar">${r[2]}</div><div><b>${r[0]}</b><div class="role">${r[1]}</div></div></div><div class="quote">«${r[3]}»</div><div class="label">Ваш ответ</div><div class="opts">${r.slice(4).map((o,n)=>`<button class="opt" onclick="answer(${n})">${o[0]}</button>`).join("")}</div><div id="fb" class="feedback"></div><div id="nx" class="next"></div></main>`}
function answer(n){let x=rounds[i],b=x.b,r=x.r,tiers=["correct","mid","wrong"],pts=[b[2],b[3],b[4]][n];score+=pts;document.querySelectorAll(".opt").forEach((e,k)=>{e.disabled=true;if(k===n)e.classList.add(tiers[n])});let fb=document.querySelector("#fb"),title=n===0?"Сильный ответ":n===1?"Так себе":"Мимо";fb.className="feedback show "+tiers[n];fb.innerHTML=`<b>${title} · ${pts>0?"+":""}${pts}</b><div>${r[4+n][1]}</div>`;document.querySelector("#nx").innerHTML=`<button class="btn" onclick="next()">${i===rounds.length-1?"Итоги смены":"Следующий клиент"}</button>`}
function next(){if(i===rounds.length-1){clearInterval(timer);final();return}i++;play()}
function final(){app.innerHTML=`<div class="center"><div class="sub">Итоги смены</div><div class="big">${score}<small style="font-size:18px;color:var(--dim)"> / ${max}</small></div><h2>${score>=max-4?"Эксперт клуба":score>=Math.round(max*.55)?"Тренер-консультант":"Стажёр смены"}</h2><p>${score>=max-4?"Отличная аргументация — вы уверенно проходите путь от возражения до закрытия.":score>=Math.round(max*.55)?"Хорошая база. Освежите техники работы с чужим мнением и закрытия.":"Пройдите игру ещё раз и уделите внимание блоку закрытия сделки."}</p><button class="btn" onclick="renderIntro()">Пройти ещё раз</button></div><div class="foot">Тренажёр основан на публичной информации 35' Health Clubs — тарифах, методике MILON и условиях гарантии.</div>`}
const app=document.querySelector("#app");renderIntro();
</script></body></html>
